name: media_client_tv
description: A neutral media client interface for Android TV.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  shared_preferences: ^2.3.2
  http: ^1.2.0
  path_provider: ^2.1.2
  video_player: ^2.8.6
  qr_flutter: ^4.1.0
  xml: ^6.5.0
  ffi: ^2.1.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/lua/
    - assets/index.html

name: Generate and Save Keystore Secret

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Name of the GitHub Secret to save to (e.g., RELEASE_KEYSTORE_BASE64)'
        required: true
        default: 'RELEASE_KEYSTORE_BASE64'
        type: string
      key_alias:
        description: 'Key Alias Name'
        required: true
        default: 'my-release-key'
        type: string
      key_password:
        description: 'Keystore Password'
        required: true
        type: string

jobs:
  generate-and-store:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      # Note: If GITHUB_TOKEN lacks permission to write repository secrets in your repo settings,
      # replace secrets.GITHUB_TOKEN below with a Personal Access Token (PAT) stored as a secret.
    steps:
      - name: Generate JKS Keystore
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "${{ inputs.key_alias }}" \
            -keypass "${{ inputs.key_password }}" \
            -storepass "${{ inputs.key_password }}" \
            -dname "CN=Android, OU=Development, O=Local, L=Unknown, ST=Unknown, C=US"

      - name: Base64 Encode and Save to GitHub Secret
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SECRET_NAME: ${{ inputs.secret_name }}
        run: |
          echo "Encoding keystore to base64..."
          # -w 0 prevents line-wrapping so it outputs as a single continuous string
          BASE64_KEYSTORE=$(base64 -w 0 release.jks)
          
          echo "Saving to repository secret: $SECRET_NAME..."
          echo "$BASE64_KEYSTORE" | gh secret set "$SECRET_NAME"
          
          echo "Successfully stored keystore secret!"

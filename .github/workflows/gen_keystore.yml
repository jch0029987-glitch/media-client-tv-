name: Generate and Save All Keystore Secrets

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key Alias Name'
        required: true
        default: 'my-release-key'
        type: string
      key_password:
        description: 'Keystore & Key Password'
        required: true
        type: string

jobs:
  generate-and-store:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Generate JKS Keystore
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "${{ inputs.key_alias }}" \
            -keypass "${{ inputs.key_password }}" \
            -storepass "${{ inputs.key_password }}" \
            -dname "CN=Android, OU=Development, O=Local, L=Unknown, ST=Unknown, C=US"

      - name: Save All Signing Secrets via PAT
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          KEY_PASS: ${{ inputs.key_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
        run: |
          echo "1. Encoding and saving keystore binary..."
          base64 -w 0 release.jks | gh secret set "RELEASE_KEYSTORE_BASE64"
          
          echo "2. Saving store password..."
          echo "$KEY_PASS" | gh secret set "STORE_PASSWORD"
          
          echo "3. Saving key password..."
          echo "$KEY_PASS" | gh secret set "KEY_PASSWORD"
          
          echo "4. Saving key alias..."
          echo "$KEY_ALIAS" | gh secret set "KEY_ALIAS"
          
          echo "All signing secrets successfully saved to repository!"

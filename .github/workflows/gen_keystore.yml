name: Generate and Save Keystore Secret

on:
  workflow_dispatch:
    inputs:
      secret_name:
        description: 'Name of the GitHub Secret to save to (e.g., RELEASE_KEYSTORE_BASE64)'
        required: true
        default: 'RELEASE_KEYSTORE_BASE64'
        type: string
      key_alias:
        description: 'Key Alias Name'
        required: true
        default: 'my-release-key'
        type: string
      key_password:
        description: 'Keystore Password'
        required: true
        type: string

jobs:
  generate-and-store:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      # Note: Depending on your repo settings, standard GITHUB_TOKEN may need 
      # repo admin permissions or a personal access token (PAT) stored as a secret 
      # to update repository secrets.
    steps:
      - name: Generate JKS Keystore
        run: |
          keytool -genkey -v \
            -keystore release.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias "${{ inputs.key_alias }}" \
            -keypass "${{ inputs.key_password }}" \
            -storepass "${{ inputs.key_password }}" \
            -dname "CN=Android, OU=Development, O=Local, L=Unknown, ST=Unknown, C=US"

      - name: Base64 Encode Keystore and Push to GitHub Secrets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SECRET_NAME: ${{ inputs.secret_name }}
          KEYSTORE_PASS: ${{ inputs.key_password }}
          KEY_ALIAS: ${{ inputs.key_alias }}
        shell: python3 {0}
        run: |
          import os
          import base64
          import json
          import urllib.request
          from nacl import encoding, public

          token = os.environ["GH_TOKEN"]
          repo = os.environ["REPOSITORY"]
          secret_name = os.environ["SECRET_NAME"]
          
          # 1. Read and base64 encode the generated keystore file
          with open("release.jks", "rb") as f:
              keystore_bytes = f.read()
          encoded_keystore = base64.b64encode(keystore_bytes).decode("utf-8")

          # 2. Get the repository's public key for secret encryption
          api_url = f"https://api.github.com/repos/{repo}/actions/secrets/public-key"
          req = urllib.request.Request(
              api_url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28"
              }
          }
          
          try:
              with urllib.request.urlopen(req) as response:
                  public_key_data = json.loads(response.read().decode("utf-8"))
          except Exception as e:
              print(f"Error fetching public key (Ensure GITHUB_TOKEN has actions/secrets write permissions or use a PAT): {e}")
              raise e

          public_key_bytes = base64.b64decode(public_key_data["key"])
          public_key_id = public_key_data["key_id"]

          # 3. Encrypt the base64 keystore using PyNaCl
          public_key = public.PublicKey(public_key_bytes, encoding.EncryptedEncoding)
          sealed_box = public.SealedBox(public_key)
          encrypted_bytes = sealed_box.encrypt(encoded_keystore.encode("utf-8"))
          encrypted_value = base64.b64encode(encrypted_bytes).decode("utf-8")

          # 4. Upload the encrypted secret via GitHub API
          secret_url = f"https://api.github.com/repos/{repo}/actions/secrets/{secret_name}"
          payload = json.dumps({
              "encrypted_value": encrypted_value,
              "key_id": public_key_id
          }).encode("utf-8")

          secret_req = urllib.request.Request(
              secret_url,
              data=payload,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json"
              },
              method="PUT"
          )

          with urllib.request.urlopen(secret_req) as resp:
              print(f"Successfully saved keystore to secret: {secret_name} (Status: {resp.status})")

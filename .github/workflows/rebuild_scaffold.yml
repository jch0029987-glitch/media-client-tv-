name: Regenerate Android Scaffold

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Regenerate Android Scaffold & Restore Custom Files
        run: |
          # 1. Copy custom files to a temporary backup directory
          mkdir -p /tmp/android_backup
          cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/
          cp -r android/app/src/main/kotlin /tmp/android_backup/
          cp -r android/app/src/main/res/xml /tmp/android_backup/
          [ -f android/app/key.properties ] && cp android/app/key.properties /tmp/android_backup/

          # 2. Delete the old android directory
          rm -rf android

          # 3. Regen clean Android scaffold
          flutter create . --platforms=android

          # 4. Copy the custom files back into the new scaffold
          cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp -r /tmp/android_backup/kotlin/* android/app/src/main/kotlin/
          cp -r /tmp/android_backup/xml/* android/app/src/main/res/xml/
          [ -f /tmp/android_backup/key.properties ] && cp /tmp/android_backup/key.properties android/app/key.properties

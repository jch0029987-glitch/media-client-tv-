name: Regenerate Android Scaffold

on:
  workflow_dispatch:

jobs:
  regen:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Regenerate Android Scaffold & Restore Custom Files
        run: |
          echo "1. Copying custom files to temporary backup..."
          mkdir -p /tmp/android_backup
          
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/android_backup/
          fi
          
          if [ -d "android/app/src/main/kotlin" ]; then
            cp -r android/app/src/main/kotlin /tmp/android_backup/
          fi
          
          if [ -d "android/app/src/main/res/xml" ]; then
            cp -r android/app/src/main/res/xml /tmp/android_backup/
          fi
          
          if [ -f "android/app/key.properties" ]; then
            cp android/app/key.properties /tmp/android_backup/
          fi

          echo "2. Deleting old android directory..."
          rm -rf android

          echo "3. Regenerating clean Android scaffold..."
          flutter create . --platforms=android

          echo "4. Restoring custom files..."
          if [ -f "/tmp/android_backup/AndroidManifest.xml" ]; then
            cp /tmp/android_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          
          if [ -d "/tmp/android_backup/kotlin" ]; then
            KOTLIN_DEST=$(find android/app/src/main/kotlin -type d | head -n 1)
            cp -r /tmp/android_backup/kotlin/* "$KOTLIN_DEST/" || true
          fi
          
          if [ -d "/tmp/android_backup/xml" ]; then
            mkdir -p android/app/src/main/res/xml
            cp -r /tmp/android_backup/xml/* android/app/src/main/res/xml/
          fi
          
          if [ -f "/tmp/android_backup/key.properties" ]; then
            cp /tmp/android_backup/key.properties android/app/key.properties
          fi
          
          echo "Scaffold regeneration and restoration completed successfully!"

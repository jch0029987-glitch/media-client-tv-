name: Build TV App APK

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed release APK & Publish to Releases?'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Force Android SDK Overrides Early
        run: |
          echo "flutter.compileSdkVersion=36" > android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

      - name: Install Host Multilib & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib autoconf automake libtool make cmake

      - name: Build libcurl with mbedTLS for armeabi-v7a (Static with PIC & HTTPS)
        run: |
          echo "Cloning mbedTLS and libcurl sources..."
          rm -rf mbedtls curl mbedtls_dist
          git clone --depth 1 --branch v3.6.0 --recurse-submodules https://github.com/Mbed-TLS/mbedtls.git
          git clone --depth 1 https://github.com/curl/curl.git

          NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_PATH"
          
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/clang --target=armv7a-linux-androideabi21"
          export AR="$TOOLCHAIN/llvm-ar"
          export AS="$TOOLCHAIN/llvm-as"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export STRIP="$TOOLCHAIN/llvm-strip"

          WORKSPACE_ROOT="$PWD"
          MBEDTLS_PREFIX="$WORKSPACE_ROOT/mbedtls_dist"

          echo "Compiling mbedTLS statically..."
          cd mbedtls
          mkdir build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
                   -DANDROID_ABI=armeabi-v7a \
                   -DANDROID_PLATFORM=android-21 \
                   -DCMAKE_C_FLAGS="-fPIC" \
                   -DCMAKE_INSTALL_PREFIX="$MBEDTLS_PREFIX" \
                   -DENABLE_TESTS=OFF \
                   -DENABLE_PROGRAMS=OFF
          make -j$(nproc)
          make install
          
          cd "$WORKSPACE_ROOT"

          echo "Configuring libcurl with mbedTLS..."
          cd curl
          autoreconf -fi
          ./configure --host=arm-linux-androideabi \
                      --prefix="$WORKSPACE_ROOT/curl/dist" \
                      --disable-shared \
                      --enable-static \
                      --with-mbedtls="$MBEDTLS_PREFIX" \
                      --without-libpsl \
                      --disable-ldap \
                      --disable-dict \
                      --disable-file \
                      --disable-gopher \
                      --disable-imap \
                      --disable-pop3 \
                      --disable-rtsp \
                      --disable-smtp \
                      --disable-telnet \
                      --disable-tftp \
                      CFLAGS="-fPIC"

          echo "Compiling libcurl..."
          make -j$(nproc)
          make install
          
          cd "$WORKSPACE_ROOT"

      - name: Clone & Compile BitTorrent Engine for armeabi-v7a
        run: |
          WORKSPACE_ROOT="$PWD"

          echo "Cloning lightweight BitTorrent engine..."
          rm -rf bittorrent_engine
          git clone --depth 1 https://github.com/jakerieger/Tori.git bittorrent_engine

          NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"

          echo "Compiling BitTorrent engine source files..."
          cd bittorrent_engine
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="$NDK_PATH/build/cmake/android.toolchain.cmake" \
                   -DANDROID_ABI=armeabi-v7a \
                   -DANDROID_PLATFORM=android-21 \
                   -DCMAKE_C_FLAGS="-fPIC" \
                   -DCMAKE_CXX_FLAGS="-fPIC -std=c++20"
          make -j$(nproc)
          
          cd "$WORKSPACE_ROOT"

      - name: Build LuaJIT, CJSON & Compile Unified Native Bridge with Torrent Engine
        run: |
          WORKSPACE_ROOT="$PWD"

          echo "Cloning LuaJIT and Lua-CJSON sources..."
          rm -rf LuaJIT lua-cjson
          git clone https://github.com/LuaJIT/LuaJIT.git
          git clone https://github.com/mpx/lua-cjson.git
          
          cd lua-cjson
          sed -i '/static void luaL_setfuncs/,/^\}/d' lua_cjson.c
          cd "$WORKSPACE_ROOT"

          NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET_CC="$TOOLCHAIN/clang --target=armv7a-linux-androideabi21"

          echo "Compiling LuaJIT..."
          cd LuaJIT
          make clean
          make HOST_CC="gcc -m32" \
               STATIC_CC="$TARGET_CC -fPIC" \
               DYNAMIC_CC="$TARGET_CC -fPIC" \
               TARGET_LD="$TARGET_CC" \
               TARGET_AR="$TOOLCHAIN/llvm-ar rcus" \
               TARGET_STRIP="$TOOLCHAIN/llvm-strip" \
               TARGET_SYS=Linux
          cd "$WORKSPACE_ROOT"

          echo "Compiling Lua-CJSON object files..."
          cd lua-cjson
          $TARGET_CC -fPIC -O3 -c strbuf.c fpconv.c lua_cjson.c -I../LuaJIT/src
          cd "$WORKSPACE_ROOT"

          echo "Preparing jniLibs output directory..."
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a

          echo "Compiling unified native libluajit.so with libcurl, LuaJIT, CJSON, and BitTorrent Engine..."
          $TOOLCHAIN/clang --target=armv7a-linux-androideabi21 -shared -fPIC \
            -std=c++20 -Dthread_local=_Thread_local \
            -Icurl/dist/include \
            -ILuaJIT/src \
            -Ilua-cjson \
            -Ibittorrent_engine/include \
            android/app/src/main/cpp/bridge.c \
            lua-cjson/strbuf.o lua-cjson/fpconv.o lua-cjson/lua_cjson.o \
            bittorrent_engine/build/lib/libtori.a \
            curl/dist/lib/libcurl.a \
            mbedtls_dist/lib/libmbedtls.a \
            mbedtls_dist/lib/libmbedcrypto.a \
            mbedtls_dist/lib/libmbedx509.a \
            LuaJIT/src/libluajit.a \
            -o android/app/src/main/jniLibs/armeabi-v7a/libluajit.so \
            -llog -lz -lm -latomic -lc++

          ls -lh android/app/src/main/jniLibs/armeabi-v7a/libluajit.so

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare Keystore and Signing Properties
        if: ${{ inputs.build_release == true }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build APK (Chromecast HD Optimized)
        run: |
          if [ "${{ inputs.build_release }}" == "true" ]; then
            flutter build apk --release --target-platform=android-arm
          else
            flutter build apk --debug --target-platform=android-arm
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-client-tv-binary
          path: build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Publish GitHub Release & Upload APK via GH CLI
        if: ${{ inputs.build_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-${{ github.run_number }}"
          RELEASE_TITLE="Media Client TV v1.0.0-${{ github.run_number }}"
          RELEASE_NOTES="Automated signed release build for Android TV (Chromecast HD optimized 32-bit armeabi-v7a with LuaJIT, libcurl HTTPS, CJSON, and integrated native BitTorrent engine)."
          
          APK_PATH=$(find build/app/outputs/flutter-apk/ -name "app-release.apk" -o -name "*.apk" | head -n 1)
          
          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            "$APK_PATH"

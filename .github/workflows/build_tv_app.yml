name: Build TV App APK

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed release APK & Publish to Releases?'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload assets
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Force Android SDK Overrides Early
        run: |
          echo "flutter.compileSdkVersion=36" > android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

      - name: Install Host Multilib Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib

      - name: Build LuaJIT for armeabi-v7a (Cloud CI)
        run: |
          echo "Cloning LuaJIT source..."
          git clone https://github.com/LuaJIT/LuaJIT.git
          cd LuaJIT

          NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_PATH"
          
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64"

          echo "Compiling LuaJIT for 32-bit ARM (bypassing host strip collision)..."
          make clean
          make HOST_CC="gcc -m32" \
               CROSS="" \
               TARGET_SYS=Linux \
               TARGET_CFLAGS="-fPIC" \
               TARGET_LDFLAGS="-latomic" \
               CC="$TOOLCHAIN/bin/clang --target=armv7a-linux-androideabi21" \
               AR="$TOOLCHAIN/bin/llvm-ar rcus" \
               STRIP="true"

          echo "Moving compiled libluajit.so into Android jniLibs..."
          mkdir -p ../android/app/src/main/jniLibs/armeabi-v7a
          cp src/libluajit.so ../android/app/src/main/jniLibs/armeabi-v7a/
          cd ..
          
          # Quick verification
          ls -lh android/app/src/main/jniLibs/armeabi-v7a/libluajit.so

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare Keystore and Signing Properties
        if: ${{ inputs.build_release == true }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build APK (Chromecast HD Optimized)
        run: |
          if [ "${{ inputs.build_release }}" == "true" ]; then
            flutter build apk --release --target-platform=android-arm
          else
            flutter build apk --debug --target-platform=android-arm
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-client-tv-binary
          path: build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Publish GitHub Release & Upload APK
        if: ${{ inputs.build_release == true }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/*.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: "Media Client TV v1.0.0-${{ github.run_number }}"
          body: "Automated signed release build for Android TV (Chromecast HD optimized 32-bit armeabi-v7a with LuaJIT)."
          draft: false
          prerelease: false

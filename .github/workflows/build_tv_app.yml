name: Build TV App APK

on:
  workflow_dispatch:
    inputs:
      build_release:
        description: 'Build signed release APK & Publish to Releases?'
        required: true
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload assets
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Force Android SDK Overrides Early
        run: |
          echo "flutter.compileSdkVersion=36" > android/local.properties
          echo "flutter.targetSdkVersion=34" >> android/local.properties

      - name: Install Host Multilib & Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib autoconf automake libtool make

      - name: Build libcurl for armeabi-v7a (Static with PIC)
        run: |
          echo "Cloning libcurl source..."
          rm -rf curl
          git clone --depth 1 https://github.com/curl/curl.git
          cd curl || exit 1

          NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          echo "Using Android NDK at: $NDK_PATH"
          
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC="$TOOLCHAIN/clang --target=armv7a-linux-androideabi21"
          export AR="$TOOLCHAIN/llvm-ar"
          export AS="$TOOLCHAIN/llvm-as"
          export RANLIB="$TOOLCHAIN/llvm-ranlib"
          export STRIP="$TOOLCHAIN/llvm-strip"

          echo "Configuring libcurl..."
          autoreconf -fi
          ./configure --host=arm-linux-androideabi \
                      --prefix=$(pwd)/dist \
                      --disable-shared \
                      --enable-static \
                      --without-ssl \
                      --without-libpsl \
                      --disable-ldap \
                      --disable-dict \
                      --disable-file \
                      --disable-gopher \
                      --disable-imap \
                      --disable-pop3 \
                      --disable-rtsp \
                      --disable-smtp \
                      --disable-telnet \
                      --disable-tftp \
                      CFLAGS="-fPIC"

          echo "Compiling libcurl..."
          make -j$(nproc)
          make install
          cd ..

      - name: Build LuaJIT & Compile HTTP-Enabled Native Bridge
        run: |
          echo "Cloning LuaJIT source..."
          rm -rf LuaJIT
          git clone https://github.com/LuaJIT/LuaJIT.git
          cd LuaJIT || exit 1

          NDK_PATH=$(find $ANDROID_SDK_ROOT/ndk -maxdepth 1 -mindepth 1 | sort -V | tail -n 1)
          TOOLCHAIN="$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin"
          TARGET_CC="$TOOLCHAIN/clang --target=armv7a-linux-androideabi21"

          echo "Compiling LuaJIT..."
          make clean
          make HOST_CC="gcc -m32" \
               STATIC_CC="$TARGET_CC -fPIC" \
               DYNAMIC_CC="$TARGET_CC -fPIC" \
               TARGET_LD="$TARGET_CC" \
               TARGET_AR="$TOOLCHAIN/llvm-ar rcus" \
               TARGET_STRIP="$TOOLCHAIN/llvm-strip" \
               TARGET_SYS=Linux

          cd ..

          echo "Preparing jniLibs output directory..."
          mkdir -p android/app/src/main/jniLibs/armeabi-v7a

          echo "Compiling unified native libluajit.so with libcurl HTTP bridge..."
          $TOOLCHAIN/clang --target=armv7a-linux-androideabi21 -shared -fPIC \
            -std=c11 -Dthread_local=_Thread_local \
            -Icurl/dist/include \
            -ILuaJIT/src \
            android/app/src/main/cpp/bridge.c \
            curl/dist/lib/libcurl.a \
            LuaJIT/src/libluajit.a \
            -o android/app/src/main/jniLibs/armeabi-v7a/libluajit.so \
            -llog -lz -lm -latomic

          # Verification check
          ls -lh android/app/src/main/jniLibs/armeabi-v7a/libluajit.so

      - name: Install Dependencies
        run: flutter pub get

      - name: Prepare Keystore and Signing Properties
        if: ${{ inputs.build_release == true }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat <<EOF > android/key.properties
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build APK (Chromecast HD Optimized)
        run: |
          if [ "${{ inputs.build_release }}" == "true" ]; then
            flutter build apk --release --target-platform=android-arm
          else
            flutter build apk --debug --target-platform=android-arm
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: media-client-tv-binary
          path: build/app/outputs/flutter-apk/
          retention-days: 7

      - name: Publish GitHub Release & Upload APK via GH CLI
        if: ${{ inputs.build_release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-${{ github.run_number }}"
          RELEASE_TITLE="Media Client TV v1.0.0-${{ github.run_number }}"
          RELEASE_NOTES="Automated signed release build for Android TV (Chromecast HD optimized 32-bit armeabi-v7a with LuaJIT + libcurl HTTP bridge)."
          
          APK_PATH=$(find build/app/outputs/flutter-apk/ -name "app-release.apk" -o -name "*.apk" | head -n 1)
          
          echo "Creating release $TAG_NAME..."
          gh release create "$TAG_NAME" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            "$APK_PATH"

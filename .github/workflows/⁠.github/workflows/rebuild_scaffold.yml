name: Regenerate Android Scaffold & Verify

on:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true

      - name: Backup Custom Files & Signing Properties
        run: |
          echo "Backing up custom Android files..."
          mkdir -p /tmp/custom_backup
          
          # Backup Manifest, Kotlin source, XML assets, and key properties
          if [ -f "android/app/src/main/AndroidManifest.xml" ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/custom_backup/
          fi
          if [ -d "android/app/src/main/kotlin" ]; then
            cp -r android/app/src/main/kotlin /tmp/custom_backup/
          fi
          if [ -d "android/app/src/main/res/xml" ]; then
            cp -r android/app/src/main/res/xml /tmp/custom_backup/
          fi
          if [ -f "android/app/key.properties" ]; then
            cp android/app/key.properties /tmp/custom_backup/
          fi

      - name: Regenerate Android Scaffold
        run: |
          echo "Wiping old android directory..."
          rm -rf android
          
          echo "Generating fresh Android platform files..."
          flutter create . --platforms=android

      - name: Restore Custom Files via cp
        run: |
          echo "Restoring custom files into fresh scaffold..."
          
          if [ -f "/tmp/custom_backup/AndroidManifest.xml" ]; then
            cp /tmp/custom_backup/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          if [ -d "/tmp/custom_backup/kotlin" ]; then
            cp -r /tmp/custom_backup/kotlin/* android/app/src/main/kotlin/ || true
          fi
          if [ -d "/tmp/custom_backup/xml" ]; then
            cp -r /tmp/custom_backup/xml/* android/app/src/main/res/xml/ || true
          fi
          if [ -f "/tmp/custom_backup/key.properties" ]; then
            cp /tmp/custom_backup/key.properties android/app/key.properties
          fi

      - name: Enforce Compile/Target SDKs
        run: |
          GRADLE_FILE="android/app/build.gradle.kts"
          if [ -f "$GRADLE_FILE" ]; then
            echo "Updating SDK versions to 36/34 in $GRADLE_FILE"
            sed -i 's/compileSdk\s*=\s*[0-9]*/compileSdk = 36/g' "$GRADLE_FILE"
            sed -i 's/targetSdk\s*[0-9]*/targetSdk = 34/g' "$GRADLE_FILE"
          fi

      - name: Decode Keystore from Secrets (Fallback)
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ] && [ ! -f "android/app/key.jks" ]; then
            echo "Decoding keystore..."
            echo "$SIGNING_KEY_BASE64" | base64 --decode > android/app/key.jks
          fi

      - name: Install Dependencies & Validate Gradle
        run: |
          flutter pub get
          cd android
          ./gradlew check --stacktrace

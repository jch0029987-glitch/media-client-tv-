<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Media Client TV - Plugin Manager</title>
  <style>
    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 30px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #1e1e1e;
      padding: 24px;
      border-radius: 12px;
      border: 1px solid #333;
    }
    h2 { margin-top: 0; color: #4dabf7; }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #2c2c2c;
      border: 1px solid #444;
      color: #fff;
      border-radius: 6px;
      box-sizing: border-box;
      margin-bottom: 16px;
      font-size: 14px;
    }
    textarea {
      width: 100%;
      height: 350px;
      background: #181818;
      border: 1px solid #444;
      color: #e3e3e3;
      font-family: monospace;
      padding: 12px;
      border-radius: 6px;
      box-sizing: border-box;
      resize: vertical;
      font-size: 14px;
    }
    button {
      background-color: #1971c2;
      color: white;
      border: none;
      padding: 12px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      margin-top: 16px;
    }
    button:hover { background-color: #1864ab; }
    #status { margin-top: 12px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Lua Plugin & Scraper Deployer</h2>
    <p style="color: #aaa; font-size: 13px;">Write or paste your Lua plugin script below and deploy it directly to the TV storage sandbox.</p>
    
    <label for="pluginName">Filename:</label>
    <input type="text" id="pluginName" value="plugin_youtube.lua" placeholder="plugin_name.lua">
    
    <label for="luaCode">Lua Code:</label>
    <textarea id="luaCode">-- Example Lua Plugin Script
function get_catalog()
    return "status: success"
end

return get_catalog()</textarea>
    
    <br>
    <button onclick="deployPlugin()">Deploy to TV Engine</button>
    <div id="status"></div>
  </div>

  <script>
    async function deployPlugin() {
      const name = document.getElementById('pluginName').value;
      const code = document.getElementById('luaCode').value;
      const statusEl = document.getElementById('status');
      
      statusEl.style.color = '#ccc';
      statusEl.innerText = 'Deploying script to TV...';

      try {
        const response = await fetch('/api/plugins/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: name, code: code })
        });
        
        const result = await response.json();
        if (response.ok && result.status === 'success') {
          statusEl.style.color = '#69db7c';
          statusEl.innerText = `Success! ${result.message} (Engine: ${result.engine_status})`;
        } else {
          statusEl.style.color = '#ff6b6b';
          statusEl.innerText = `Error: ${result.message || 'Unknown error'}`;
        }
      } catch (err) {
        statusEl.style.color = '#ff6b6b';
        statusEl.innerText = `Network Error: ${err.message}`;
      }
    }
  </script>
</body>
</html>
